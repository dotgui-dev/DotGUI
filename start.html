  <style>
    #homestuff { display:flex; flex-direction:column; align-items:center; gap:20px; text-align:center; min-height:60vh; justify-content:center; }

  <div id="main">
    <main id="homestuff">
      <img src="media/full.png" width="250px" alt="DotGUI Logo">
      <span class="update-badge">Patch Update • 9/14/2026</span>
      <div class="search-container">
        <input id="bar" type="text" placeholder="Search or enter URL..." autocomplete="off" spellcheck="false">
        <button onclick="nav()">Go</button>
      </div>
      <div class="button-container">
        <button onclick="navTo('https://youtube.com')"><img src="media/quick/datube.svg" alt="YouTube"></button>
        <button onclick="navTo('https://web.spotify.com')"><img src="media/quick/bigtify.svg" alt="Spotify"></button>
        <button onclick="navTo('https://github.com')"><img src="media/quick/github.svg" alt="Github"></button>
      </div>
      <p id="random-text" style="font-size:1.2em; margin:20px 0;"></p>
      <p>Join our <a onclick=window.location.href="https://discord.com/invite/U8tT8AazXb">community server</a>! Make sure to star DotGUI on GitHub if you fork it!</p>
    <script>
        function navTo(url) {
            try { sessionStorage.setItem("searchQuery", url); } catch(e) {}
            window.location.href = "search.html?q=" + encodeURIComponent(url);
        }
        function nav() {
            var q = document.getElementById("bar").value.trim();
            if (!q) return;
            var target;
            if (q.indexOf(" ") === -1 && q.indexOf(".") !== -1) {
                target = q.startsWith("http") ? q : "https://" + q;
            } else {
                target = "https://html.duckduckgo.com/html/?q=" + encodeURIComponent(q);
            }
            try { sessionStorage.setItem("searchQuery", target); } catch(e) {}
            window.location.href = "search.html?q=" + encodeURIComponent(q);
        }
        document.getElementById("bar").addEventListener("keydown", function(e){ if(e.key==="Enter") nav(); });
        const texts = [
            '"Work on DotGUI or play Roblox?" - me, probably',
            "Did you know? DotGUI would've been 'Zenithub Rework', rebrand seemed cool. So much for that...",
            "If I remade DotGUI, search would be day one fr",
            "Militant is the best TDS starter, change my mind",
            "Who needs announcements when you got these?",
            "Stop using the request form for problems fr",
            "Like 3 people still check Discord, just join it",
            "Too many ideas, not enough time tbh",
            "Wish people used the latest DotGUI, but oh well",
        ];
        document.getElementById("random-text").textContent = texts[Math.floor(Math.random() * texts.length)];
    </script>

    </main>

  <script>
          // dotgui-panic: global panic key, guards typing
          document.addEventListener('keydown', function(e) {
            var t = e.target;
            if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
            var key = '';
            try { key = localStorage.getItem('dotgui_panic_key') || 'k'; } catch (err) { key = 'k'; }
            if ((e.key || '').toLowerCase() !== (key || '').toLowerCase() || !key) return;
            try {
              document.title = 'Google';
              var f = document.querySelector("link[rel~='icon']");
              if (f) f.href = 'https://www.google.com/favicon.ico';
            } catch (err) {}
            var go = true, url = 'https://classroom.google.com';
            try {
              go = (localStorage.getItem('dotgui_panic_redirect') || 'true') === 'true';
              url = localStorage.getItem('dotgui_panic_url') || url;
            } catch (err) {}
            if (go && url) window.location.href = url;
          });
        </script>
</body>
  <script>
    (function() {
      const value = localStorage.getItem('tabCloaker') || 'default';
      const favicon = document.querySelector("link[rel~='icon']") || (() => {
        const link = document.createElement('link');
        link.rel = 'icon';
        document.head.appendChild(link);
        return link;
      })();
      if (value === 'google') {
        document.title = 'Google';
        favicon.href = 'https://www.google.com/favicon.ico';
      } else if (value === 'vocab') {
        document.title = 'My Learning | Vocabulary.com';
        favicon.href = 'https://www.vocabulary.com/favicon.ico';
      } else if (value === 'canvas') {
          document.title = 'Canvas';
          favicon.href = 'https://canvas.instructure.com/favicon.ico';
        } else if (value === 'drive') {
          document.title = 'Google Drive';
          favicon.href = 'https://drive.google.com/favicon.ico';
        } else if (value === 'docs') {
          document.title = 'Google Docs';
          favicon.href = 'https://docs.google.com/favicon.ico';
        } else {
        favicon.href = 'favicon.ico';
      }
    })();
  </script>
